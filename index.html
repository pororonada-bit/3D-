
<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Naruto 3D Viewer</title>

<script type="module"
src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.0.0/model-viewer.min.js">
</script>

<style>
body {
  margin: 0;
  background: #151515;
  color: white;
  font-family: sans-serif;
  text-align: center;
}

h1 {
  padding: 20px;
  letter-spacing: 3px;
}

model-viewer {
  width: 100%;
  height: 75vh;
  background: #252525;
}

p {
  color: #aaa;
  padding: 15px;
}
</style>
</head>

<body>

<h1>NARUTO 3D</h1>

<model-viewer
  src="naruto35_seated_3d.glb"
  camera-controls
  auto-rotate
  shadow-intensity="1"
  exposure="1"
  environment-image="neutral">
</model-viewer>

<p>화면을 터치해서 나루토를 회전해 보세요.</p>

</body>
</html>
